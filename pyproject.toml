[project]
name = "embmigrate"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "numpy",
  "torch",
  "sentence-transformers",
  "datasets",
  "pytrec-eval-terrier",
  "pandas",
  "matplotlib",
  "vec2text>=0.0.13",
  "sacrebleu>=2.6.0",
  "transformers>=4.44,<4.47",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embmigrate"]
